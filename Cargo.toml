[package]
name = "bad_apple"
version = "1.1.0"
edition = "2021"
description = "Bad Apple played with real Windows windows, with two visual modes"
license = "MIT"
repository = "https://github.com/blycr/bad_apple_virus"
default-run = "bad_apple"

[dependencies]
include-bytes-zstd = "0.1.0"
kira = { version = "0.8.4", default-features = false, features = ["cpal", "ogg"] }

[dependencies.windows]
version = "0.42.0"
features = [
    # core
    "Win32_Foundation",
    # window creation
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    # commandline helper
    "Win32_System_Console",
    # GetModuleHandleA
    "Win32_System_LibraryLoader",
]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[package.metadata.winres]
FileDescription = "Bad Apple Windows Player"
ProductName = "Bad Apple Windows Player"
CompanyName = "blycr / original by mon"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
