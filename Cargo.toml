[package]
name = "bad_apple_win"
version = "0.1.0"
edition = "2021"
description = "Bad Apple played with real Windows windows as pixels (rewrite, adapted to this machine)"

[dependencies]
include-bytes-zstd = "0.1.0"
kira = { version = "0.8.4", default-features = false, features = ["cpal", "ogg"] }

[dependencies.windows]
version = "0.42.0"
features = [
    # core
    "Win32_Foundation",
    # window creation / message loop / DPI / hotkey
    "Win32_UI_WindowsAndMessaging",
    # RegisterHotKey / VK_ESCAPE
    "Win32_UI_Input_KeyboardAndMouse",
    # background brushes
    "Win32_Graphics_Gdi",
    # console attach for println output
    "Win32_System_Console",
    # GetModuleHandleW
    "Win32_System_LibraryLoader",
]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
